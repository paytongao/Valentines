<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Will You Be My Valentine?</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fff0f3;
      font-family: 'Georgia', serif;
    }

    .cute-gif {
      width: 200px;
      height: auto;
      margin-bottom: 1rem;
      border-radius: 16px;
    }

    h1 {
      color: #c62828;
      font-size: 2.5rem;
      margin-bottom: 2rem;
      text-align: center;
      line-height: 1.3;
    }

    .buttons {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn-yes {
      background: #e53935;
      color: white;
      border: none;
      padding: 0.9rem 2.5rem;
      font-size: 1.25rem;
      font-family: 'Georgia', serif;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, font-size 0.3s, padding 0.3s;
      box-shadow: 0 4px 15px rgba(229, 57, 53, 0.4);
    }

    .btn-yes:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(229, 57, 53, 0.5);
    }

    .btn-no {
      background: #bdbdbd;
      color: white;
      border: none;
      padding: 0.9rem 2.5rem;
      font-size: 1.25rem;
      font-family: 'Georgia', serif;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.15s, font-size 0.3s, padding 0.3s;
    }

    .response {
      display: none;
      margin-top: 2rem;
      font-size: 1.5rem;
      color: #c62828;
      text-align: center;
      animation: fadeIn 0.5s ease;
    }

    .response.visible {
      display: block;
    }

    .hidden-player {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
      pointer-events: none;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hmph-popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      width: 250px;
      height: 250px;
      animation: hmphPop 2.5s ease forwards;
      z-index: 20;
      pointer-events: none;
    }

    .hmph-popup img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    @keyframes hmphPop {
      0% { transform: translate(-50%, -50%) scale(0) rotate(-20deg); opacity: 0; }
      15% { transform: translate(-50%, -50%) scale(1.3) rotate(10deg); opacity: 1; }
      25% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
      75% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(0.5) rotate(-10deg); opacity: 0; }
    }

    .celebration {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    .confetti-heart {
      position: absolute;
      font-size: 2rem;
      animation: confettiFall 3s ease-in forwards;
    }

    @keyframes confettiFall {
      0% {
        transform: translateY(-10vh) rotate(0deg) scale(1);
        opacity: 1;
      }
      100% {
        transform: translateY(110vh) rotate(720deg) scale(0.5);
        opacity: 0;
      }
    }

    .falling-petal {
      position: fixed;
      top: -5vh;
      pointer-events: none;
      z-index: 0;
      animation: petalFall linear infinite;
      opacity: 0.8;
    }

    @keyframes petalFall {
      0% {
        transform: translateY(0) rotate(0deg) translateX(0px);
        opacity: 0;
      }
      10% {
        opacity: 0.8;
      }
      90% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(110vh) rotate(360deg) translateX(80px);
        opacity: 0;
      }
    }

    .bubu-dudu {
      width: 280px;
      margin-bottom: 1.5rem;
    }

    .fade-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: black;
      opacity: 0;
      z-index: 100;
      pointer-events: none;
      transition: opacity 2s ease;
    }

    .fade-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .slideshow {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: black;
      z-index: 101;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .slideshow.active {
      display: flex;
    }

    .slideshow img {
      max-width: 85%;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 12px;
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    .slideshow img.visible {
      opacity: 1;
    }

    .slideshow .end-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      opacity: 0;
      transition: opacity 1s ease;
    }

    .slideshow .end-container.visible {
      opacity: 1;
    }

    .slideshow .end-container img {
      max-width: 400px;
      width: 80%;
      opacity: 1;
      border-radius: 12px;
    }

    .slideshow .end-msg {
      color: white;
      font-size: 3rem;
      font-family: 'Georgia', serif;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <img class="cute-gif" src="https://media1.tenor.com/m/snwhuSNwrbsAAAAC/cute-bear.gif" alt="Cute bear with hearts">
  <h1>Will You Be My Valentine?</h1>
  <div class="buttons" id="buttons">
    <button class="btn-yes" id="btnYes" onclick="sayYes()">Yes!</button>
    <button class="btn-no" id="btnNo" onclick="sayNo()">No</button>
  </div>
  <div class="response" id="responseYes">
    <p>Yay!! You made my day! &#10084;&#65039;</p>
  </div>

  <div class="celebration" id="celebration"></div>
  <div class="fade-overlay" id="fadeOverlay"></div>
  <div class="slideshow" id="slideshow">
    <img id="slideshowImg" src="" alt="slideshow photo">
  </div>

  <script>
    let noAttempts = 0;
    let petalInterval = null;

    function sayYes() {
      document.getElementById('buttons').style.display = 'none';
      document.getElementById('responseYes').classList.add('visible');
      launchCelebration();

      // Swap to bubu dudu GIF
      const gif = document.querySelector('.cute-gif');
      gif.src = 'https://media1.tenor.com/m/uzM3q07nz6IAAAAC/bubu-dudu-sseeyall.gif';
      gif.alt = 'Bubu and Dudu';
      gif.classList.add('bubu-dudu');

      // Start cherry blossoms falling
      const petals = ['🌸', '🌸', '🌸', '🌺', '💮', '🩷', '🌷', '✿'];
      function createPetal() {
        const petal = document.createElement('span');
        petal.classList.add('falling-petal');
        petal.textContent = petals[Math.floor(Math.random() * petals.length)];
        petal.style.left = Math.random() * 100 + '%';
        petal.style.fontSize = (Math.random() * 1.2 + 0.8) + 'rem';
        petal.style.animationDuration = (Math.random() * 5 + 5) + 's';
        petal.style.animationDelay = (Math.random() * 2) + 's';
        document.body.appendChild(petal);
        setTimeout(() => petal.remove(), 12000);
      }
      petalInterval = setInterval(createPetal, 400);
      for (let i = 0; i < 15; i++) {
        setTimeout(createPetal, i * 200);
      }

      // Play YouTube audio in hidden iframe
      const player = document.createElement('div');
      player.className = 'hidden-player';
      player.innerHTML = '<iframe width="1" height="1" src="https://www.youtube.com/embed/pS7Hbxv2E_E?autoplay=1&start=5&loop=1&playlist=pS7Hbxv2E_E" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>';
      document.body.appendChild(player);

      // After 3 seconds, fade to black then start slideshow
      setTimeout(() => {
        document.getElementById('fadeOverlay').classList.add('active');
        // Stop petals
        clearInterval(petalInterval);

        // After fade completes (2s transition), start slideshow
        setTimeout(() => {
          startSlideshow();
        }, 2000);
      }, 3000);
    }

    function startSlideshow() {
      const photos = ['photos/1.jpg', 'photos/2.jpg', 'photos/3.jpg', 'photos/4.jpg', 'photos/5.jpg', 'photos/6.jpg'];
      const slideshow = document.getElementById('slideshow');
      const img = document.getElementById('slideshowImg');
      let index = 0;
      let interval = null;

      slideshow.classList.add('active');

      function showNext() {
        if (index >= photos.length) {
          clearInterval(interval);
          // Fade out last photo, show end message
          img.classList.remove('visible');
          setTimeout(() => {
            img.style.display = 'none';
            const container = document.createElement('div');
            container.className = 'end-container';
            const gif = document.createElement('img');
            gif.src = 'https://media1.tenor.com/m/ew_c7J9LQtsAAAAC/i-used-to-pray-for-times-like-this.gif';
            gif.alt = 'I used to pray for times like this';
            container.appendChild(gif);
            const msg = document.createElement('div');
            msg.className = 'end-msg';
            msg.textContent = 'BRO I HAVE NO MORE PHOTOS';
            container.appendChild(msg);
            slideshow.appendChild(container);
            setTimeout(() => container.classList.add('visible'), 100);
          }, 800);
          return;
        }
        img.classList.remove('visible');
        setTimeout(() => {
          img.src = photos[index];
          img.onload = () => {
            img.classList.add('visible');
          };
          index++;
        }, 300);
      }

      showNext();
      interval = setInterval(showNext, 2500);
    }

    function sayNo() {
      noAttempts++;
      const btn = document.getElementById('btnNo');
      const btnYes = document.getElementById('btnYes');

      // Shrink No, grow Yes
      const noScale = Math.max(0.5, 1 - noAttempts * 0.08);
      const yesScale = 1 + noAttempts * 0.12;
      btn.style.fontSize = (1.25 * noScale) + 'rem';
      btn.style.padding = `${0.9 * noScale}rem ${2.5 * noScale}rem`;
      btnYes.style.fontSize = Math.min(2.2, 1.25 * yesScale) + 'rem';
      btnYes.style.padding = `${Math.min(1.4, 0.9 * yesScale)}rem ${Math.min(4, 2.5 * yesScale)}rem`;

      // Pop the animated crying emoji GIF
      const hmph = document.createElement('div');
      hmph.className = 'hmph-popup';
      const img = document.createElement('img');
      img.src = 'https://media1.tenor.com/m/j_xLL133xz0AAAAC/pout-hmph.gif';
      img.alt = 'crying emoji';
      hmph.appendChild(img);
      document.body.appendChild(hmph);
      setTimeout(() => hmph.remove(), 2500);
    }

    function launchCelebration() {
      const celebration = document.getElementById('celebration');
      const hearts = ['❤️', '💕', '💗', '💖', '💘', '💝', '🌹', '✨'];

      for (let i = 0; i < 60; i++) {
        setTimeout(() => {
          const heart = document.createElement('span');
          heart.classList.add('confetti-heart');
          heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
          heart.style.left = Math.random() * 100 + '%';
          heart.style.fontSize = (Math.random() * 2 + 1) + 'rem';
          heart.style.animationDuration = (Math.random() * 2 + 2) + 's';
          celebration.appendChild(heart);

          setTimeout(() => heart.remove(), 4000);
        }, i * 50);
      }
    }
  </script>
</body>
</html>
